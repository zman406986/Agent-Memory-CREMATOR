# Mount cremator-dsh into a dsh profile. Pass this file to `dsh --patch`:
#
#   dsh --profile headless --patch ./patch.yml "your task"
#
# `name` is a file:/// URL to the built entry, not a package specifier: after
# `npm run build`, replace the placeholder with
# `file:///C:/Users/TZhen/Desktop/racoons/packages/adapters/dsh/dist/plugin.js`
# (other owner device: `file:///C:/Users/TZ/Desktop/racoons/...`). Values are
# the mount's flat config knobs; every key is optional.
- insert:
    - id: racoons-mount
      name: 'file:///path/to/racoons/packages/adapters/dsh/dist/plugin.js'
      config:
        barBytes: 512
        enforcement: apply
        contextWindowTokens: 400000
        pruneThresholdTokens: 60000
        entryAskTrigger: { mode: 'off' }
        pruneAskGrammar: nokeepall
        nativeCompactionBackstop: true
